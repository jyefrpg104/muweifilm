name: Verify static site build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build publishable website (does not deploy)
        run: bash scripts/build-site.sh
      - name: Verify output and unchanged assets
        run: bash scripts/test-site.sh
      - name: Store preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-preview
          path: dist/
          include-hidden-files: true
