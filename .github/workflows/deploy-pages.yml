name: Deploy website to GitHub Pages

# Intentionally manual-only for the initial cutover. This workflow does NOT
# auto-deploy on push until the GitHub Pages source has been switched to Actions
# and a successful production deployment has been verified.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Build site distribution
        run: bash scripts/build-site.sh

      - name: Validate website, domain and Photo Quest
        run: bash scripts/test-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated dist directory for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
