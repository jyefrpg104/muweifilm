name: Deploy website to GitHub Pages

# After switching Settings -> Pages -> Source to GitHub Actions, all changes on
# main get an automatic Pages deploy, with live URL checks. This workflow
# supports root-layout and the muwei-website/ source folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Build site distribution
        run: bash scripts/build-site.sh

      - name: Validate website, domain and Photo Quest
        run: bash scripts/test-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated dist directory for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out for byte-level live verification
        uses: actions/checkout@v4

      - name: Rebuild expected deployment files
        run: bash scripts/build-site.sh

      - name: Verify published HTML, CSS, images and Photo Quest
        run: bash scripts/check-live-site.sh
