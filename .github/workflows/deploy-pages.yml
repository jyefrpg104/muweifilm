name: Deploy website to GitHub Pages

# PRODUCTION environment (www.muweifilm.com).
# Only runs for main. main is protected: changes arrive through a pull request
# that already passed "verify" and was checked on the dev preview URL.
# Settings -> Pages -> Source must stay "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run all checks (tests, build, dist verification)
        run: bash scripts/run-checks.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated dist directory for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out for byte-level live verification
        uses: actions/checkout@v4

      - name: Rebuild expected deployment files
        run: bash scripts/build-site.sh

      - name: Verify published HTML, CSS, images and Photo Quest
        run: bash scripts/check-live-site.sh
