<script>const filters=['year-filter','type-filter','client-filter'].map(id=>document.getElementById(id));const rows=[...document.querySelectorAll('.work-list li')];function closePreview(row){const b=row.querySelector('.work-row'),p=row.querySelector('.work-preview');if(p)p.remove();b.setAttribute('aria-expanded','false');b.querySelector('.work-row__go').textContent='點開預覽 ＋'}function filterWorks(){const[y,t,c]=filters.map(x=>x.value);rows.forEach(r=>{const ok=(!y||r.innerText.includes(y))&&(!t||r.dataset.type===t)&&(!c||r.innerText.includes(c));r.classList.toggle('hidden',!ok);if(!ok)closePreview(r)})}filters.forEach(x=>x.addEventListener('change',filterWorks));document.querySelectorAll('.work-row').forEach(button=>button.addEventListener('click',()=>{const row=button.parentElement;if(button.getAttribute('aria-expanded')==='true'){closePreview(row);return}rows.forEach(r=>{if(r!==row)closePreview(r)});const id=button.dataset.youtube,preview=document.createElement('div');preview.className='work-preview';preview.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&playsinline=1" title="作品預覽" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p class="work-preview__foot"><a href="https://youtu.be/'+id+'" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></p>';row.append(preview);button.setAttribute('aria-expanded','true');button.querySelector('.work-row__go').textContent='收起預覽 ×';preview.scrollIntoView({behavior:'smooth',block:'nearest'})}))</script>
