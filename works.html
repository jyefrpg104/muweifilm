<script>const filters=['year-filter','type-filter'].map(id=>document.getElementById(id));const rows=[...document.querySelectorAll('.work-list li')];const moreButton=document.querySelector('.works-more');const batchSize=5;let visibleLimit=batchSize;function closePreview(row){const b=row.querySelector('.work-row'),p=row.querySelector('.work-preview');if(p)p.remove();b.setAttribute('aria-expanded','false');b.querySelector('.work-row__go').textContent='點開預覽 ＋'}function renderWorks(reset=false){if(reset)visibleLimit=batchSize;const[y,t]=filters.map(x=>x.value);let shown=0,matches=0;rows.forEach(r=>{const match=(!y||r.innerText.includes(y))&&(!t||r.dataset.type===t);if(match)matches+=1;const hidden=!match||shown>=visibleLimit;if(match)shown+=1;r.classList.toggle('hidden',hidden);if(hidden)closePreview(r)});moreButton.hidden=matches<=visibleLimit;moreButton.setAttribute('aria-expanded','false');moreButton.textContent='展開更多作品'}filters.forEach(x=>x.addEventListener('change',()=>renderWorks(true)));moreButton.addEventListener('click',()=>{visibleLimit+=batchSize;renderWorks()});renderWorks(true);document.querySelectorAll('.work-row').forEach(button=>button.addEventListener('click',()=>{const row=button.parentElement;if(button.getAttribute('aria-expanded')==='true'){closePreview(row);return}rows.forEach(r=>{if(r!==row)closePreview(r)});const id=button.dataset.youtube,preview=document.createElement('div');preview.className='work-preview';preview.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&playsinline=1" title="作品預覽" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p class="work-preview__foot"><a href="https://youtu.be/'+id+'" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></p>';row.append(preview);button.setAttribute('aria-expanded','true');button.querySelector('.work-row__go').textContent='收起預覽 ×';preview.scrollIntoView({behavior:'smooth',block:'nearest'})
