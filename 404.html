<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>找不到這一頁｜Muwei Film 木尉影像</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2314161A'/><text x='16' y='23' font-family='serif' font-size='20' font-weight='700' fill='%23E6E7E2' text-anchor='middle'>木</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════
   MUWEI FILM 木尉影像
   場記表 / production-document aesthetic
   ════════════════════════════════════════════ */

:root {
  color-scheme: only light;
  --paper:      #E6E7E2;
  --paper-warm: #EFF0EB;
  --ink:        #14161A;
  --ink-soft:   #5A5F66;
  --rule:       #C6C8C2;
  --carbon:     #1F3A5F;

  --serif: "Noto Serif TC", "Songti TC", serif;
  --sans:  "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

  --gut: clamp(20px, 5vw, 72px);
  --max: 1280px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

@media (prefers-color-scheme: dark) {
  :root { color-scheme: only light; }
  html, body { background: var(--paper); color: var(--ink); }
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; height: auto; }

a { color: inherit; }

::selection { background: var(--carbon); color: var(--paper); }

:focus-visible {
  outline: 2px solid var(--carbon);
  outline-offset: 3px;
}

.skip {
  position: absolute; left: -9999px;
}
.skip:focus {
  left: 12px; top: 12px; z-index: 99;
  background: var(--ink); color: var(--paper);
  padding: 10px 16px; font-family: var(--mono); font-size: 13px;
}

/* ── 共用：規格表 label/value ───────────── */
.spec { margin: 0; }
.spec > div {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--rule);
}
.spec dt {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-soft);
  line-height: 2.1;
}
.spec dd { margin: 0; font-size: 14.5px; }
.spec a { color: var(--carbon); text-decoration: none; border-bottom: 1px solid var(--rule); }
.spec a:hover { border-color: var(--carbon); }

/* ── 標籤 eyebrow ─────────────────────── */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--carbon);
  margin: 0 0 14px;
}

/* ── 圖框：圖片還沒放時顯示場記板佔位 ──── */
.ph {
  position: relative;
  margin: 0;
  aspect-ratio: 4 / 5;
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  overflow: hidden;
}
.ph--wide { aspect-ratio: 16 / 9; }
.ph--tall { aspect-ratio: 4 / 5; }

.ph::before {
  content: "";
  position: absolute; inset: 10px;
  border: 1px dashed var(--rule);
}
.ph::after {
  content: attr(data-ph);
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--ink-soft);
  text-align: center;
  word-break: break-all;
}
.ph > img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
  background: var(--paper-warm);
}

/* ── 頂部列 ───────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  padding: 12px var(--gut);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.bar__mark {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .18em;
  text-decoration: none;
  white-space: nowrap;
}
.bar__mark span {
  font-family: var(--serif);
  letter-spacing: .05em;
  margin-left: 10px;
  color: var(--ink-soft);
}
.bar__nav { display: flex; align-items: center; gap: clamp(14px, 3vw, 30px); }
.bar__nav a {
  font-size: 13.5px;
  text-decoration: none;
  color: var(--ink-soft);
  white-space: nowrap;
}
.bar__nav a:hover { color: var(--ink); }
.bar__cta {
  color: var(--carbon) !important;
  border-bottom: 1px solid var(--carbon);
  padding-bottom: 1px;
}

@media (max-width: 620px) {
  .bar__mark span { display: none; }
  .bar__nav { gap: 15px; }
  .bar__nav a { font-size: 12.5px; }
}

/* ── HERO ─────────────────────────────── */
.hero {
  max-width: var(--max);
  margin: 0 auto;
  padding: clamp(46px, 8vw, 96px) var(--gut) clamp(40px, 6vw, 76px);
}
.hero__sheet { max-width: 380px; margin-bottom: clamp(34px, 5vw, 52px); }

.hero__title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(38px, 8.4vw, 92px);
  line-height: 1.18;
  letter-spacing: .01em;
  margin: 0 0 26px;
}
.hero__title em {
  font-style: normal;
  color: var(--carbon);
  position: relative;
}
.hero__title em::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: .04em;
  height: 2px; background: var(--carbon); opacity: .3;
}

.hero__lede {
  max-width: 40em;
  font-size: clamp(15px, 1.5vw, 17px);
  color: #2C3138;
  margin: 0 0 22px;
}
.hero__poem {
  font-family: var(--serif);
  font-size: 15px;
  color: var(--ink-soft);
  letter-spacing: .16em;
  margin: 0 0 34px;
}

.hero__acts { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: clamp(44px, 7vw, 80px); }

.btn {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12.5px;
  letter-spacing: .12em;
  text-decoration: none;
  padding: 13px 26px;
  border: 1px solid var(--ink);
  transition: background .18s, color .18s;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn--solid { background: var(--ink); color: var(--paper); }
.btn--solid:hover { background: var(--carbon); border-color: var(--carbon); }
.btn--full { width: 100%; text-align: center; cursor: pointer; font-family: var(--mono); }

.hero__cap {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .18em;
  color: var(--ink-soft);
  margin: 10px 0 0;
}
.btn--big { padding: 17px 40px; font-size: 13.5px; }

/* ── 區塊 ─────────────────────────────── */
.block {
  max-width: var(--max);
  margin: 0 auto;
  padding: clamp(56px, 8vw, 104px) var(--gut);
}
.block--rule { border-top: 1px solid var(--rule); }

.block__head { margin-bottom: clamp(30px, 4vw, 48px); }
.block__head h2 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(26px, 3.8vw, 40px);
  line-height: 1.3;
  margin: 0 0 10px;
  letter-spacing: .04em;
}
.block__note {
  margin: 0;
  max-width: 46em;
  font-size: 14.5px;
  color: var(--ink-soft);
}

/* ── SHOT LIST ────────────────────────── */
.shotlist {
  display: grid;
  grid-template-columns: 1fr;
  gap: 40px;
}
@media (min-width: 940px) {
  .shotlist { grid-template-columns: 1fr 396px; gap: 56px; align-items: start; }
}

.shotlist__rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }

.row { border-bottom: 1px solid var(--rule); }
.row a {
  display: grid;
  grid-template-columns: 62px 118px 74px 1fr auto;
  align-items: baseline;
  gap: 14px;
  padding: 20px 4px;
  text-decoration: none;
  transition: background .18s, padding-left .18s;
}
.row a:hover, .row a:focus-visible {
  background: var(--paper-warm);
  padding-left: 14px;
}
.row__year, .row__client, .row__kind {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .07em;
  color: var(--ink-soft);
}
.row__client { color: var(--ink); }
.row__title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(19px, 2.4vw, 27px);
  letter-spacing: .03em;
}
.row__go {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--carbon);
  opacity: 0;
  transition: opacity .18s;
}
.row a:hover .row__go, .row a:focus-visible .row__go { opacity: 1; }

@media (max-width: 720px) {
  .row a {
    grid-template-columns: 58px 1fr;
    grid-template-areas:
      "year  title"
      "year  meta";
    gap: 4px 14px;
    padding: 17px 2px;
  }
  .row a:hover { padding-left: 2px; }
  .row__year   { grid-area: year; align-self: start; padding-top: 6px; }
  .row__title  { grid-area: title; }
  .row__client { grid-area: meta; }
  .row__kind   { grid-area: meta; justify-self: start; margin-left: 0; }
  .row__client::after { content: " ／"; }
  .row__client, .row__kind { display: inline; }
  .row__go { display: none; }
}

/* 監看視窗 */
.monitor { display: none; }
@media (min-width: 940px) {
  .monitor { display: block; position: sticky; top: 92px; }
  .monitor__screen > img { transition: opacity .25s; }
  .monitor__label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .22em;
    color: var(--ink-soft);
    margin: 9px 0 0;
  }
}

/* ── 攝影格 ───────────────────────────── */
.stills { margin-top: clamp(50px, 7vw, 84px); }
.stills__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}
.stills__grid > .ph > img { filter: saturate(.94); transition: filter .25s; }
.stills__grid > .ph:hover > img { filter: saturate(1.06); }

/* ── 服務卡 ───────────────────────────── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.card {
  background: var(--paper);
  padding: 28px 24px 22px;
}
.card h3 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: .04em;
  margin: 0 0 10px;
}
.card p {
  font-size: 14px;
  color: var(--ink-soft);
  margin: 0 0 18px;
  line-height: 1.8;
}
.spec--card > div { grid-template-columns: 54px 1fr; padding: 5px 0; }
.spec--card dt { font-size: 10px; }
.spec--card dd { font-size: 13.5px; }
.spec--card > div:last-child { border-bottom: 0; }
.spec--card > div:last-child dd { color: var(--carbon); }

/* ── 流程 ─────────────────────────────── */
.process { margin-top: clamp(48px, 6vw, 76px); }
.process__list { list-style: none; margin: 0; padding: 0; }
.process__list li {
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 14.5px;
  color: var(--ink-soft);
}
.process__list li:first-child { border-top: 1px solid var(--rule); }
.process__list span {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .1em;
  color: var(--carbon);
  padding-top: 4px;
}
.process__list strong {
  display: block;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16.5px;
  color: var(--ink);
  letter-spacing: .04em;
  margin-bottom: 2px;
}

/* ── 關於 ─────────────────────────────── */
.about {
  display: grid;
  grid-template-columns: 1fr;
  gap: 34px;
}
@media (min-width: 860px) {
  .about { grid-template-columns: 330px 1fr; gap: 56px; align-items: start; }
}
.about__text p { max-width: 40em; margin: 0 0 18px; font-size: 15.5px; }
.about__text p:first-child {
  font-family: var(--serif);
  font-size: clamp(18px, 2.2vw, 23px);
  font-weight: 500;
  line-height: 1.7;
  letter-spacing: .03em;
}
.about__tags {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .1em;
  color: var(--ink-soft);
  padding-top: 8px;
  border-top: 1px solid var(--rule);
}

.clients { margin-top: clamp(46px, 6vw, 72px); }
.clients__list {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.clients__list li {
  background: var(--paper);
  padding: 15px 14px;
  font-size: 13.5px;
  color: var(--ink-soft);
}

/* ── 聯絡 ─────────────────────────────── */
.contact {
  display: grid;
  grid-template-columns: 1fr;
  gap: 40px;
}
@media (min-width: 860px) {
  .contact { grid-template-columns: 1fr 330px; gap: 60px; align-items: start; }
}
.contact__lede {
  max-width: 34em;
  font-size: 15.5px;
  margin: 0 0 26px;
}
.contact__alt {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 20px 0 0;
}
.contact__alt a { color: var(--carbon); }

/* ── 頁尾 ─────────────────────────────── */
.foot {
  border-top: 1px solid var(--ink);
  max-width: var(--max);
  margin: 0 auto;
  padding: 34px var(--gut) 54px;
}
.foot__mark {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .18em;
  margin: 0 0 6px;
}
.foot__tag {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: .04em;
  margin: 0 0 16px;
  color: var(--carbon);
}
.foot__meta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--ink-soft);
  margin: 0;
}

/* ── 進場 ─────────────────────────────── */
.reveal { opacity: 0; transform: translateY(14px); }
.reveal.is-in {
  opacity: 1; transform: none;
  transition: opacity .6s ease, transform .6s ease;
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}

</style>
</head>
<body>

<header class="bar">
  <a class="bar__mark" href="/">MUWEI FILM<span>木尉影像</span></a>
  <nav class="bar__nav" aria-label="主選單">
    <a href="/#works">作品</a>
    <a href="/#about">關於</a>
    <a href="/#contact" class="bar__cta">談合作</a>
  </nav>
</header>

<main class="hero" style="min-height:56vh">
  <p class="eyebrow">404 — NOT FOUND</p>
  <h1 class="hero__title" style="font-size:clamp(30px,6vw,60px)">這一格<em>不在</em>這捲片裡</h1>
  <p class="hero__lede">你找的頁面搬走了，或從來沒存在過。回首頁看看吧。</p>
  <div class="hero__acts"><a class="btn btn--solid" href="/">回首頁</a></div>
</main>

<footer class="foot">
  <p class="foot__mark">MUWEI FILM 木尉影像</p>
  <p class="foot__meta">© 2026 楊文翔 Jeffrey Yang</p>
</footer>

</body>
</html>
